version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: mssql-init
    depends_on:
      - sqlserver
      - backend
      - frontend
    volumes:
      - ./init.sql:/init.sql
    command: >
      /bin/sh -c "
      sleep 20 &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -C -U sa -P 'YourStrong!Passw0rd' -d master -i /init.sql &&
      echo 'Banco de dados inicializado!' &&
      exit 0;
      "
    restart: "no"

  backend:
    build:
      context: ./fale-mais-backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./fale-mais-frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
