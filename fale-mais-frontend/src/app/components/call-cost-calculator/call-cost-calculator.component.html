<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card p-4 shadow-lg rounded-3 w-100" style="max-width: 500px;">
    <h2 class="text-center mb-4">
      <i class="bi bi-telephone-fill text-primary"></i> Calculadora de Custo FaleMais
    </h2>

    <!-- 🔹 DDD de Origem -->
    <div class="mb-3">
      <label class="form-label">
        <i class="bi bi-geo-alt-fill text-secondary"></i> DDD de Origem:
      </label>
      <select class="form-select" [(ngModel)]="callCostRequest.origin" (change)="updateDestinations()">
        <option value="">Selecione o DDD de origem</option>
        <option *ngFor="let ddd of validOrigins" [value]="ddd">{{ ddd }}</option>
      </select>
      <small class="text-danger" *ngIf="submitted && errors.origin">{{ errors.origin }}</small>
    </div>

    <!-- 🔹 DDD de Destino -->
    <div class="mb-3">
      <label class="form-label">
        <i class="bi bi-arrow-right-circle-fill text-secondary"></i> DDD de Destino:
      </label>
      <select class="form-select" [(ngModel)]="callCostRequest.destination">
        <option value="">Selecione o DDD de destino</option>
        <option *ngFor="let ddd of availableDestinations" [value]="ddd">{{ ddd }}</option>
      </select>
      <small class="text-danger" *ngIf="submitted && errors.destination">{{ errors.destination }}</small>
    </div>

    <!-- 🔹 Tempo da Ligação -->
    <div class="mb-3">
      <label class="form-label">
        <i class="bi bi-clock-fill text-secondary"></i> Tempo da Ligação (min):
      </label>
      <input type="number" class="form-control" [(ngModel)]="callCostRequest.duration" min="1">
      <small class="text-danger" *ngIf="submitted && errors.duration">{{ errors.duration }}</small>
    </div>

    <!-- 🔹 Plano FaleMais -->
    <div class="mb-3">
      <label class="form-label">
        <i class="bi bi-card-list text-secondary"></i> Plano FaleMais:
      </label>
      <select class="form-select" [(ngModel)]="callCostRequest.plan">
        <option value="">Selecione um plano</option>
        <option value="FaleMais 30">FaleMais 30</option>
        <option value="FaleMais 60">FaleMais 60</option>
        <option value="FaleMais 120">FaleMais 120</option>
      </select>
      <small class="text-danger" *ngIf="submitted && errors.plan">{{ errors.plan }}</small>
    </div>

    <!-- 🔹 Botão de Calcular -->
    <button class="btn btn-primary w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center" (click)="calculateCost()">
      <i class="bi bi-calculator me-2"></i> Calcular
    </button>

    <!-- 🔹 Exibição do Resultado -->
    <div *ngIf="result" class="alert alert-success mt-3 text-center">
      <h5 class="mb-2"><i class="bi bi-clipboard-check-fill"></i> Resultado:</h5>
      <p class="text-success fw-bold">
        <i class="bi bi-check-circle-fill"></i> Com Plano: R$ {{ result.costWithPlan.toFixed(2) }}
      </p>
      <p class="text-danger fw-bold">
        <i class="bi bi-x-circle-fill"></i> Sem Plano: R$ {{ result.costWithoutPlan.toFixed(2) }}
      </p>
    </div>

    <!-- 🔹 Mensagem de Erro -->
    <div *ngIf="submitted && !!errorMessage" class="alert alert-danger mt-3 text-center">
      <p><i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}</p>
    </div>
  </div>
</div>

<!-- 📌 Bootstrap & Bootstrap Icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
